[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "fresnel"
description = "Path trace publication quality images of soft matter simulations"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
keywords = ["ray tracing", "path tracing", "soft matter", "rendering"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "pillow"]

[project.urls]
Homepage = "https://github.com/glotzerlab/fresnel"
Documentation = "https://fresnel.readthedocs.io/"

# bump2version config
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "fresnel/version.py"
regex = '^version *= *"(?P<value>[^"]+)"'

[tool.scikit-build]
minimum-version = "build-system.requires"

# scikit-build-core needs at least CMake 3.15
cmake.version = ">=3.15"

# Cache the CMake build directory in the source tree (gitignored) so repeat builds
# are incremental and `pip install -e .` can rebuild on demand.
build-dir = "build/{wheel_tag}"

# CMake installs the complete Python package (extensions, .py files, and the
# unit tests), so do not let the backend copy the source directory as well.
wheel.packages = []

# Files that are not needed to build the package
sdist.exclude = [
    ".github",
    ".vscode",
    "doc",
    "pixi.lock",
    "renovate.json",
    ".DS_Store",
    ".venv",
]

# The CPU backend is the only backend that is portable enough to build by default.
cmake.define.ENABLE_EMBREE = "ON"
cmake.define.ENABLE_OPTIX = "OFF"

[tool.scikit-build.messages]
after-failure = """
fresnel builds against the system Embree and Intel TBB libraries. If CMake
reported that embree or TBB was not found, install them along with their
headers and try again:

    apt install build-essential cmake libembree-dev libtbb-dev   (Debian/Ubuntu)
    brew install cmake embree tbb                                (macOS)

Prebuilt binaries that bundle these libraries are available on conda-forge:

    micromamba install fresnel
"""
