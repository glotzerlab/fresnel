name: Unit test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

  push:
    branches:
    - "trunk"

  workflow_dispatch:

defaults:
  run:
    shell: bash -leo pipefail {0}
