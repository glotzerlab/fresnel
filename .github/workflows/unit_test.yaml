name: Unit test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:

  push:
    branches:
    - "trunk"

  workflow_dispatch:

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  build_test:
    name: Unit test [py${{ matrix.python }} ${{ matrix.os }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['310', '311', '312', '313']
        include:
        # Render gallery images in one configuration
        - os: 'ubuntu-24.04'
          python: '313'
          render_gallery: true
        # Test macOS and windows on oldest and latest versions.
        - os: 'macos-14'
          python: '313'
        - os: 'windows-2025'
          python: '313'
          cmake_generator: "Visual Studio 17 2022"
        - os: 'windows-2022'
          python: '310'
          cmake_generator: "Visual Studio 17 2022"
        - os: 'macos-14'
          python: '310'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: code
        submodules: true
    - name: Create Python Environment
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.69.0
        cache: false
        environments: py${{ matrix.python }}
        activate-environment: true
        manifest-path: code/pixi.toml
    - name: Configure
      run: >
        CMAKE_PREFIX_PATH=${CONDA_PREFIX}
        cmake -S code -B build
        -DENABLE_EMBREE=ON
        -DENABLE_OPTIX=OFF
    - name: Build
      run: cmake --build build --config Release -j
    - name: Install
      run: cmake --install build --config Release
    - name: Run tests
      run: >
        pixi run python -m pytest --pyargs fresnel -v --log-level=DEBUG --durations=0 --durations-min=0.1
    - name: Render gallery images
      if: ${{ matrix.render_gallery }}
      run: for i in *.py; do echo "Rendering $i" && python3 $i || exit 1; done
      working-directory: code/doc/gallery

  # This job is used to provide a single requirement for branch merge conditions.
  tests_complete:
    name: Unit test
    if: always()
    needs: [build_test]
    runs-on: ubuntu-24.04

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
    - name: Done
      run: echo "Done."
